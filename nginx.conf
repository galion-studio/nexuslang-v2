# ============================================
# GALION VOICE API - NGINX CONFIGURATION
# ============================================
# Production-ready nginx configuration for voice API

upstream galion_backend {
    # Backend FastAPI servers
    server localhost:8000;
    # server backend2:8000;
    # server backend3:8000;
}

upstream galion_frontend {
    # Frontend Next.js servers
    server localhost:3003;
    # server frontend2:3003;
    # server frontend3:3003;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=voice_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frontend:10m rate=100r/s;

# SSL configuration
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied expired no-cache no-store private must-revalidate auth;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/xml+rss
    application/json;

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name galion.app www.galion.app developer.galion.app api.galion.app;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# Main Galion Voice App (galion.app)
server {
    listen 443 ssl http2;
    server_name galion.app www.galion.app;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/galion.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/galion.app/privkey.pem;

    # Root directory for static files
    root /var/www/galion-app;
    index index.html;

    # Security
    limit_req zone=frontend burst=20 nodelay;

    # Frontend proxy
    location / {
        proxy_pass http://galion_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Frontend specific settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://galion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # API specific settings
        limit_req zone=voice_api burst=5 nodelay;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket for voice streaming
    location /ws/ {
        proxy_pass http://galion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific
        limit_req zone=voice_api burst=2 nodelay;
        proxy_buffering off;
        proxy_cache off;
    }

    # Static files with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location /health {
        proxy_pass http://galion_backend;
        access_log off;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Developer Platform (developer.galion.app)
server {
    listen 443 ssl http2;
    server_name developer.galion.app;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/developer.galion.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/developer.galion.app/privkey.pem;

    # Developer platform root
    root /var/www/developer-galion;
    index index.html;

    # Rate limiting
    limit_req zone=frontend burst=50 nodelay;

    location / {
        proxy_pass http://galion_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API access for developers
    location /api/ {
        proxy_pass http://galion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Higher limits for developers
        limit_req zone=voice_api burst=20 nodelay;
    }
}

# API Gateway (api.galion.app)
server {
    listen 443 ssl http2;
    server_name api.galion.app;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api.galion.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.galion.app/privkey.pem;

    # API only - no frontend
    limit_req zone=voice_api burst=10 nodelay;

    # CORS headers for API access
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

    location / {
        proxy_pass http://galion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket endpoint
    location /ws/ {
        proxy_pass http://galion_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }

    # API documentation
    location /docs {
        proxy_pass http://galion_backend;
    }

    # Health check (public for monitoring)
    location /health {
        proxy_pass http://galion_backend;
        access_log off;
    }
}

# Default server (catch-all)
server {
    listen 80 default_server;
    listen 443 ssl http2 default_server;

    server_name _;

    # Default SSL (self-signed for catch-all)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    return 444; # Connection closed without response
}

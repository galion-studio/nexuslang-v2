# ============================================
# GALION VOICE API - DEVELOPMENT DOCKER COMPOSE
# ============================================

version: '3.8'

services:
  # Redis for sessions and caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - galion_network

  # PostgreSQL database (for future use)
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: galion
      POSTGRES_USER: galion
      POSTGRES_PASSWORD: ${DB_PASSWORD:-galion_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - galion_network

  # Galion Backend API
  backend:
    build:
      context: ./v2/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=galion
      - DB_USER=galion
      - DB_PASSWORD=${DB_PASSWORD:-galion_password}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - DEBUG=true
      - RELOAD=true
    depends_on:
      - redis
      - postgres
    volumes:
      - ./v2/backend:/app
      - /app/__pycache__
    networks:
      - galion_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Galion Frontend
  frontend:
    build:
      context: ./galion-app
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    volumes:
      - ./galion-app:/app
      - /app/node_modules
      - /app/.next
    networks:
      - galion_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (for development)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./ssl:/etc/ssl/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - galion_network

volumes:
  redis_data:
  postgres_data:

networks:
  galion_network:
    driver: bridge

# ============================================
# GALION VOICE API - PRODUCTION DOCKER COMPOSE
# ============================================

version: '3.8'

services:
  # Redis for sessions and caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - galion_network

  # PostgreSQL database (for future use)
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: galion
      POSTGRES_USER: galion
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - galion_network

  # Galion Backend API
  backend:
    build:
      context: ./v2/backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=galion
      - DB_USER=galion
      - DB_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./v2/backend/logs:/app/logs
    networks:
      - galion_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Galion Frontend
  frontend:
    build:
      context: ./galion-app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.galion.app
      - NEXT_PUBLIC_WS_URL=wss://api.galion.app/ws
    depends_on:
      - backend
    networks:
      - galion_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./ssl:/etc/ssl/certs:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./static:/var/www:ro
    depends_on:
      - backend
      - frontend
    networks:
      - galion_network

  # SSL Certificate Manager (Let's Encrypt)
  certbot:
    image: certbot/certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./ssl:/etc/ssl/certs
    command: certonly --webroot --webroot-path=/var/www/letsencrypt --email admin@galion.app --agree-tos --no-eff-email -d galion.app -d www.galion.app -d api.galion.app -d developer.galion.app
    networks:
      - galion_network

  # Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - galion_network

  # Monitoring (Grafana)
  grafana:
    image: grafana/grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - galion_network

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  galion_network:
    driver: bridge

